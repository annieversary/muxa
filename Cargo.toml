[package]
name = "muxa"
version = "0.1.0"
edition = "2021"

[features]
default = ["sqlite", "zephyr"]

mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]

img_processing = ["dep:turbojpeg", "dep:image"]
zip = ["dep:zip"]
zephyr = ["maud/zephyr"]

[dependencies]
async-session = "3.0.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-routing"] }
backtrace = "0.3.76"
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.34"
headers = "0.4.1"
http = "1.5.0"

maud = { git = "https://github.com/annieversary/maud", rev = "e39cef7b14485d05146ea1e3da1d4b3c4e21aa9e" }

paste = "1.0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.6.9", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }

turbojpeg = { version = "0.4", features = ["image"], optional = true }
image = { version = "0.24.2", optional = true }
zip = { version = "0.6.2", optional = true }
const-random = "0.1.18"

[dev-dependencies]
serial_test = "4.0.1"

[[example]]
name = "app"
required-features = ["sqlite"]
